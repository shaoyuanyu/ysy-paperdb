# Registers the paperdb MCP server (`paperdb-mcp`, stdio) as the agent tools
# `mcp__paperdb__*` in DeepSeek Harness.
#
# SOURCE OF TRUTH: this template lives in the repository (`for-agents/`) and is
# packaged into the `paperdb-dsh-<version>` release asset by
# `scripts/build_dsh_release.py`. The updater renders the placeholders below
# for each machine and writes the result to PAPERDB_DSH_INTEGRATION_DIR.
#
# The API token is deliberately NOT here: the server reads it from the file
# named by PAPERDB_MCP_TOKEN_FILE (default ~/.config/paperdb/mcp-token), so this
# bundle stays secret-free and safe to publish.
#
# Placeholders: mcp_command (venv launcher), base_url (API URL), target
# (integration dir), repo (GitHub owner/name publishing releases).
- insert:
    - id: paperdb-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: paperdb
        transport: stdio
        command: {{mcp_command}}
        env:
          PAPERDB_MCP_BASE_URL: {{base_url}}
          PAPERDB_MCP_TOKEN_FILE: "~/.config/paperdb/mcp-token"
          PAPERDB_DSH_INTEGRATION_DIR: {{target}}
          PAPERDB_UPDATE_REPO: {{repo}}
        toolCallTimeoutMs: 120000
        reconnect:
          enabled: true
          maxAttempts: 20
