name: deploy

# Deploy paperdb to the homepage VPS on every push to main.
#
# The VPS runs the stack with docker compose from a plain checkout-like
# directory at ~/paperdb (no .git). So this workflow does two things:
#   1. rsync the repository into ~/paperdb (source delivery),
#   2. docker compose up -d --build there (the actual deployment).
# Containers, image, volumes and the compose file are unchanged — only the
# source files on the box are replaced.
#
# Required repository secrets:
#   VPS_HOST      hostname/IP of the VPS
#   VPS_USER      ssh user (owns ~/paperdb)
#   VPS_SSH_KEY   private key authorized on that host
#
# Rollback: workflow_dispatch with `ref` = the commit/tag to redeploy; the
# runner checks that ref out and rsyncs+builds it the same way.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "for-agents/**"      # DSH bundle + skill: not part of the API image
  workflow_dispatch:
    inputs:
      ref:
        description: "Rollback: commit/tag to deploy (default: the pushed commit)"
        required: false
        type: string

concurrency:
  group: paperdb-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" 'echo "ssh ok: $(hostname)"'

      - name: Sync source to the VPS
        run: |
          # --delete keeps removed files from lingering (a stale .py would be
          # imported); user-local files are excluded so they survive.
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='datasets/' \
            --exclude='data/' \
            --exclude='*.log' \
            --exclude='build.pid' \
            --exclude='Dockerfile.hotfix' \
            --exclude='.test-storage/' \
            --exclude='.venv/' \
            --exclude='.deploy-rev' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            ./ "$VPS_USER@$VPS_HOST:~/paperdb/"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            "echo '${{ github.sha }}' > ~/paperdb/.deploy-rev"

      - name: Build and restart
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/paperdb
          echo "deploying $(cat .deploy-rev 2>/dev/null || echo '?')"
          docker compose -f deploy/paperdb-compose.prod.yml up -d --build

          for i in $(seq 1 90); do
            if curl -fsS --max-time 3 http://127.0.0.1:9720/readyz >/dev/null 2>&1; then
              echo "ready after ${i} tries"
              break
            fi
            if [ "$i" = 90 ]; then
              echo "API did not become ready"
              docker compose -f deploy/paperdb-compose.prod.yml logs --tail=80 paperdb-api || true
              exit 1
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:9720/healthz >/dev/null
          echo "healthz OK"
          REMOTE

      - name: Smoke test (public)
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 5 https://library.shaoyuanyu.cn/healthz; then
              echo; echo "public health OK"; exit 0
            fi
            sleep 5
          done
          echo "::warning::public /healthz did not answer; VPS checks passed, verify nginx manually"
