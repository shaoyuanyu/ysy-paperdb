name: deploy

# Deploy paperdb to the homepage VPS, the same way the web repo does it:
#
#   push to main → tag release-v<version> → ACR builds the image (GitHub App
#   watches this repo) → this workflow waits for the image → SSH to the VPS,
#   pull it, retag as paperdb:prod, `docker compose up -d` (no build on the VPS).
#
# Why not build on the VPS: the box is in China and both Docker Hub
# (python:3.12-slim) and PyPI (files.pythonhosted.org) stall or truncate; a
# local `--build` failed after ~17 min with corrupted wheels. The image is
# therefore built by ACR and the VPS only pulls from the domestic registry.
#
# Required repo variables: REGISTRY, IMAGE_NAMESPACE (same values as the web repo)
# The ACR repository must be named after this GitHub repo (`ysy-paperdb`), like
# the web repo's `ysy-homepage-web`.
# Required repo secrets:   REGISTRY_USERNAME, REGISTRY_PASSWORD  (ACR credentials)
#                          VPS_HOST, VPS_USER, VPS_SSH_KEY
# Optional:                AUTOMERGE_TOKEN — PAT used to push the tag, so ACR's
#                          GitHub App reliably receives the event (the web repo
#                          does the same; GITHUB_TOKEN is the fallback).
#
# Rollback: workflow_dispatch with `version` = an earlier image tag.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "for-agents/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Rollback: image version to deploy (e.g. 2026.11.28-abc1234)"
        required: false
        type: string

concurrency:
  group: paperdb-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push release-v* tags to trigger the ACR build
    env:
      PUSH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check configuration
        id: config
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          missing=""
          [ -z "$REGISTRY" ] && missing="$missing REGISTRY(var)"
          [ -z "$NAMESPACE" ] && missing="$missing IMAGE_NAMESPACE(var)"
          [ -z "$REGISTRY_USERNAME" ] && missing="$missing REGISTRY_USERNAME(secret)"
          [ -z "$REGISTRY_PASSWORD" ] && missing="$missing REGISTRY_PASSWORD(secret)"
          [ -z "$VPS_HOST" ] && missing="$missing VPS_HOST(secret)"
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::deploy skipped, missing:$missing"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve version
        if: steps.config.outputs.ready == 'true'
        env:
          IN_VERSION: ${{ github.event.inputs.version }}
          REGISTRY: ${{ vars.REGISTRY }}
          NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"     # ysy-paperdb — the ACR repo name
          echo "REPO=$REPO" >> "$GITHUB_ENV"
          if [ -n "$IN_VERSION" ]; then
            VERSION="$IN_VERSION"
            echo "rollback mode: $VERSION (no tag pushed)"
            echo "SKIP_BUILD=1" >> "$GITHUB_ENV"
          else
            VERSION="$(TZ=UTC git show -s --format=%cd --date=format:%Y.%m.%d HEAD)-${GITHUB_SHA:0:7}"
            echo "version: $VERSION"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE=$REGISTRY/$NAMESPACE/$REPO:$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=release-v$VERSION" >> "$GITHUB_ENV"

      - name: Login to ACR
        if: steps.config.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Push release tag (triggers the ACR build)
        if: steps.config.outputs.ready == 'true' && env.SKIP_BUILD != '1'
        run: |
          set -e
          if git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | grep -q .; then
            if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
              echo "tag and image already exist — reusing $VERSION"
              exit 0
            fi
            echo "tag exists but image is missing — re-pushing to rebuild"
            git push origin ":refs/tags/$RELEASE_TAG" || true
          fi
          if [ -n "$PUSH_TOKEN" ]; then
            git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          fi
          git tag -f "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"
          echo "pushed $RELEASE_TAG"

      - name: Wait for the ACR build
        if: steps.config.outputs.ready == 'true' && env.SKIP_BUILD != '1'
        run: |
          deadline=$((SECONDS + 2700))   # ACR build limit is 30 min
          while true; do
            if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
              echo "image ready: $IMAGE"
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::ACR did not finish $IMAGE within 45 min — check the build log in the ACR console"
              exit 1
            fi
            sleep 20
          done

      - name: Sync the prod compose file
        if: steps.config.outputs.ready == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            deploy/paperdb-compose.prod.yml \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/paperdb/deploy/paperdb-compose.prod.yml"

      - name: Deploy over SSH
        if: steps.config.outputs.ready == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          REGISTRY: ${{ vars.REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "REGISTRY='$REGISTRY' NS='${{ vars.IMAGE_NAMESPACE }}' REPO='$REPO' VERSION='$VERSION' \
             REG_USER='$REGISTRY_USERNAME' REG_PASS='$REGISTRY_PASSWORD' bash -s" <<'REMOTE'
          set -euo pipefail
          echo "$REG_PASS" | docker login "$REGISTRY" -u "$REG_USER" --password-stdin
          IMAGE="$REGISTRY/$NS/$REPO:$VERSION"
          docker pull "$IMAGE"
          docker tag "$IMAGE" paperdb:prod

          cd ~/paperdb
          docker compose --env-file .env -f deploy/paperdb-compose.prod.yml up -d

          for i in $(seq 1 90); do
            if curl -fsS --max-time 3 http://127.0.0.1:9720/readyz >/dev/null 2>&1; then
              echo "ready after ${i} tries"
              break
            fi
            if [ "$i" = 90 ]; then
              echo "API did not become ready"
              docker compose --env-file .env -f deploy/paperdb-compose.prod.yml logs --tail=80 paperdb-api || true
              exit 1
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:9720/healthz >/dev/null && echo "healthz OK"
          echo "deployed $VERSION"
          REMOTE

      - name: Smoke test (public)
        if: steps.config.outputs.ready == 'true'
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 5 https://library.shaoyuanyu.cn/healthz; then
              echo; echo "public health OK"; exit 0
            fi
            sleep 5
          done
          echo "::warning::public /healthz did not answer; VPS checks passed, verify nginx manually"
