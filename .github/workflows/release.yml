name: release

# Publishing a release is how DSH installs and refreshes the paperdb
# integration: push a tag that matches pyproject's version, e.g.
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Tag matches the declared version
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match pyproject version {version}")
          PY
      - name: Build the DSH integration asset
        run: uv run python scripts/build_dsh_release.py --out dist
      - name: Build wheel and sdist
        run: uv build --out-dir dist
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "paperdb $GITHUB_REF_NAME" \
            --generate-notes $prerelease
